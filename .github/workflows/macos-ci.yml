name: macOS CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        working-directory: macos
        run: swift package resolve

      - name: Build
        working-directory: macos
        run: swift build -c release

      - name: Run tests
        working-directory: macos
        env:
          INTERLINEDLIST_EMAIL: ${{ secrets.INTERLINEDLIST_EMAIL }}
          INTERLINEDLIST_PASSWORD: ${{ secrets.INTERLINEDLIST_PASSWORD }}
          INTERLINEDLIST_API_BASE_URL: ${{ secrets.INTERLINEDLIST_API_BASE_URL }}
        run: swift test --parallel

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: InterlinedSync-macOS
          path: macos/.build/release/InterlinedSync
          if-no-files-found: warn
          retention-days: 30

