name: macOS CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package dependencies
        working-directory: macos
        run: swift package resolve

      - name: Build
        working-directory: macos
        run: swift build -c release 2>&1 | xcpretty || swift build -c release

      - name: Run tests
        working-directory: macos
        run: swift test --parallel 2>&1 | xcpretty || swift test --parallel

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: InterlinedSync-macOS
          path: macos/.build/release/InterlinedSync
          if-no-files-found: warn
          retention-days: 30

  build-pkg:
    name: Build, Sign & Notarize .pkg
    needs: build-and-test
    runs-on: macos-14
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.APPLE_ID != ''

    env:
      DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app bundle
        run: bash macos/scripts/make-app.sh

      - name: Import Developer ID certificate into temporary keychain
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          security create-keychain -p "" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "" "${KEYCHAIN_PATH}"

          echo "${DEVELOPER_ID_CERT_BASE64}" | base64 --decode > "${CERT_PATH}"
          security import "${CERT_PATH}" \
            -P "${DEVELOPER_ID_CERT_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "${KEYCHAIN_PATH}"

          security list-keychain -d user -s "${KEYCHAIN_PATH}" $(security list-keychain -d user | tr -d '"')

          rm -f "${CERT_PATH}"

      - name: Sign, notarize, and package
        run: bash macos/scripts/make-pkg.sh

      - name: Upload signed .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterlinedSync-pkg
          path: macos/build/InterlinedSync-0.1.0.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Clean up temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          if [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
