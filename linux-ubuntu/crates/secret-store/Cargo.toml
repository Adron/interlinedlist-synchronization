[package]
name = "secret-store"
version = "0.1.0"
edition = "2021"

[features]
default = []
# gnome-keyring enables the GNOME Keyring / libsecret backend.
# secret-service depends on zbus which uses D-Bus; it compiles on macOS
# (no D-Bus headers required) but only connects at runtime on Linux.
gnome-keyring = ["secret-service"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }

secret-service = { version = "3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"